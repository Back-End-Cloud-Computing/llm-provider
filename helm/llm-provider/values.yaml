image:
  repository: joao2006/llm-provider
  tag: ""            # vazio usa o appVersion do Chart.yaml
  pullPolicy: IfNotPresent

replicaCount: 3

# Secret criado fora do chart (kubectl create secret, ver README do chart).
# Chave esperada: OPENROUTER_API_KEY. É opcional: sem ele o pod sobe e, com
# config.LLM_PROVIDER=mock, responde pelo provedor offline.
existingSecret: llm-provider-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Variáveis não sensíveis. openrouter usa a OPENROUTER_API_KEY do Secret acima;
# sem o Secret o serviço cai sozinho para o mock.
config:
  APP_ENV: production
  LOG_LEVEL: INFO
  AUTH_SERVICE_BASE_URL: http://authorization:8081
  LLM_PROVIDER: openrouter
